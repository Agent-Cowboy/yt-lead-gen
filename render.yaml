services:
  # FastAPI Web Service
  - type: web
    name: yt-lead-gen-web
    runtime: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt &&
      PLAYWRIGHT_BROWSERS_PATH=/opt/render/project/src/.browsers playwright install --with-deps chromium
    startCommand: PLAYWRIGHT_BROWSERS_PATH=/opt/render/project/src/.browsers uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: REDIS_URL
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.7
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/src/.browsers
