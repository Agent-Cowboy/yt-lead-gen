<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found — YT Lead Gen</title>
    <meta name="robots" content="noindex, nofollow" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
    <style>
      body { font-family: "Inter", system-ui, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; }
    </style>
  </head>
  <body>
    <div class="min-h-screen flex items-center justify-center px-4">
      <div class="text-center">
        <h1 class="text-8xl font-extrabold text-slate-700 mb-4">404</h1>
        <h2 class="text-2xl font-semibold text-white mb-4">Page Not Found</h2>
        <p class="text-slate-400 mb-8 max-w-md mx-auto">
          The page you're looking for doesn't exist or has been moved.
        </p>
        <a
          href="/"
          class="inline-block px-8 py-3 rounded-xl font-semibold text-white"
          style="background: linear-gradient(135deg, #ff4500, #ff6b3d); box-shadow: 0 0 20px rgba(255, 69, 0, 0.3);"
        >
          Back to Home
        </a>
      </div>
    </div>
  </body>
</html>
