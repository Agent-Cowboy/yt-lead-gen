services:
  # FastAPI Web Service
  - type: web
    name: yt-lead-gen-web
    runtime: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt &&
      playwright install --with-deps chromium
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: REDIS_URL
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.7

  # Celery Background Worker
  - type: worker
    name: yt-lead-gen-worker
    runtime: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt &&
      playwright install --with-deps chromium
    startCommand: celery -A worker.celery_app worker --loglevel=info --concurrency=1
    envVars:
      - key: REDIS_URL
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.7
